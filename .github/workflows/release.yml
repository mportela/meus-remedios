name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: APK de Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar wrapper do Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Restaurar keystore da keystore base64
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > app/meus-remedios-key.jks

      - name: Criar arquivo key.properties
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$(pwd)/app/meus-remedios-key.jks
          EOF

      - name: Build de release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK de release
        uses: actions/upload-artifact@v5
        with:
          name: meus-remedios-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
